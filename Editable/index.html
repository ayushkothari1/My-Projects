<!DOCTYPE html>
<html>
  <head>
    <title>Editable Page</title>
    <style>
      #myDiv {
        border: 1px solid #ccc;
        padding: 10px;
        min-height: 50px;
      }
    </style>
  </head>
  <body id="body1" contenteditable="true">
    <h2 contenteditable="true" id="h2">Edit this text below:</h2>
    <div id="myDiv" contenteditable="true">
      This is editable content. Try changing me!
    </div>

    <script src="script.js"></script>
  </body>
</html>
