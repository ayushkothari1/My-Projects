<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile statics</title>
    <script
      src="https://kit.fontawesome.com/85a0c3de0e.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stats-container">
      <i class="fa-solid fa-briefcase fa-3x icon"></i>
      <div class="counter" id="year" data-ceil="15">15</div>
      <h4>Year Experience</h4>
    </div>
    <div class="stats-container">
      <i class="fas fa-cloud fa-3x icon"></i>
      <div class="counter" id="website" data-ceil="260">15</div>
      <h4>Website Made</h4>
    </div>
    <div class="stats-container">
      <i class="fab fa-apple fa-3x icon"></i>
      <div class="counter" id="mode" data-ceil="27">27</div>
      <h4>Apps Made</h4>
    </div>
    <script src="script.js"></script>
  </body>
</html>
